steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-worker-image'
    args:
      - 'build'
      - '--file=backend/Dockerfile'
      - '--tag=gcr.io/$PROJECT_ID/promdata-backend:$COMMIT_SHA'
      - '--tag=gcr.io/$PROJECT_ID/promdata-backend:latest'
      - 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-worker-image'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/promdata-backend'
    waitFor: ['build-worker-image']

  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    id: 'deploy-worker-pool'
    entrypoint: gcloud
    args:
      - 'beta'
      - 'run'
      - 'worker-pools'
      - 'deploy'
      - 'promdata-worker'
      - '--project=promdata-enterprise'
      - '--region=us-east4'
      - '--image=gcr.io/$PROJECT_ID/promdata-backend:$COMMIT_SHA'
      - '--instances=1'
      - '--cpu=4'
      - '--memory=16Gi'
      - '--command=celery'
      # [QW-3 FIX 2026-07-25] Concurrency y pools alineados a Redis Cloud
      # Essentials (256 conn). Los defaults Essentials-tuned viven en el
      # codigo (backend/app/core/config.py: 6/6/2/3, broker=5, result=5) y
      # son la unica fuente de verdad — por eso los overrides inflados de
      # REDIS_MAX_CONNECTIONS_* / CELERY_*_POOL_* se eliminan de este YAML
      # (la limpieza del worker en vivo ya se ejecuto el 2026-06-10; dejar
      # estos valores aqui los re-introduciria en el proximo deploy).
      # Migracion a Pro 1: ver AGENTS.md §4.4b/§12.3 — primero el plan,
      # luego las variables.
      - '--args=^|^-A|app.celery_app|worker|--loglevel=info|--pool=prefork|--concurrency=4|--max-tasks-per-child=50|-Ofair|--prefetch-multiplier=1|-Q|default,analysis,background'
      - '--update-env-vars=^|^GEMINI_RETRY_MAX_RETRIES=3|GEMINI_RETRY_BASE_DELAY_SECONDS=1.0|GEMINI_RETRY_MAX_DELAY_SECONDS=15.0|GEMINI_RETRY_JITTER_SECONDS=0.5'
    waitFor: ['push-worker-image']

images:
  - 'gcr.io/$PROJECT_ID/promdata-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/promdata-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
